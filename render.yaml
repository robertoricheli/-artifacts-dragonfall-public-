# Deploy no Render: Blueprint ou sync via npm run df:render:sync -- --push
# Pacote flat em render-deploy-tmp/ (rootDir = ".")
services:
  - type: web
    name: dragonfall-multiplayer
    runtime: node
    # Layout flat do repo de deploy (index.mjs na raiz).
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    # Starter = always-on (elimina cold start do free). Ajuste no Dashboard se o plano diferir.
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "https://dragonfall.netlify.app,https://artifacts-dragonfall.netlify.app,http://127.0.0.1:5173,http://localhost:5173"
      - key: DF_KEEPALIVE
        value: "1"
      - key: DF_MAX_ROOMS
        value: "40"
      - key: DF_MAX_QUEUE
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: dragonfall-postgres
          property: connectionString
      # Redis — BullMQ ranked + Socket.IO adapter (multi-instância)
      - key: REDIS_URL
        sync: false
      # RoomStore: memory (default) | redis (dual-write Memory+Redis + lock NX)
      - key: DF_ROOM_STORE
        value: "memory"
      - key: DF_AUTH_ENC_KEY
        sync: false
      # Em produção ranked: defina REDIS_URL. DF_REQUIRE_REDIS=1 falha o boot sem Redis.
      # Fase E: recomenda-se DF_REQUIRE_REDIS=1 quando REDIS_URL estiver no Dashboard.
      - key: DF_REQUIRE_REDIS
        value: "0"

databases:
  - name: dragonfall-postgres
    plan: basic-256mb
    databaseName: dragonfall
    user: dragonfall
